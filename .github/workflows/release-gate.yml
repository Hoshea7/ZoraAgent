name: Release Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.3)"
        required: true
        type: string

jobs:
  automated-gates:
    name: "Automated Release Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: "L1: Unit tests"
        run: bun run test:unit

      - name: "L2: Integration tests"
        run: bun run test:integration

      - name: Configure E2E Provider
        env:
          ZORA_TEST_PROVIDER_CONFIG: ${{ secrets.ZORA_TEST_PROVIDER_CONFIG }}
        run: |
          test -n "$ZORA_TEST_PROVIDER_CONFIG"
          mkdir -p "$HOME/.zora"
          printf '%s\n' "$ZORA_TEST_PROVIDER_CONFIG" > "$HOME/.zora/providers.json"

      - name: "L3: Electron E2E"
        run: xvfb-run -a bun run test:e2e

      - name: "Gate Summary"
        if: always()
        run: |
          echo "## Release Gate Results for v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Automated (L1-L3)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] L1 Unit" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] L2 Integration" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] TypeScript check" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] L3 Electron E2E" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] PDF 422 回归：当前产品层只传递 PDF 不可直接读取的说明文本" >> $GITHUB_STEP_SUMMARY
