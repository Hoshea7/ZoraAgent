name: Release Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.3)"
        required: true
        type: string

jobs:
  automated-gates:
    name: "Automated Release Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: "L1+L2: Unit & Integration tests"
        run: bun run test

      - name: Build check
        run: bun run build

      - name: "L3: Live Agent tests"
        env:
          ZORA_TEST_PROVIDER_CONFIG: ${{ secrets.ZORA_TEST_PROVIDER_CONFIG }}
          ZORA_REQUIRE_LIVE_PROVIDER: "1"
        run: bun run test:live

      - name: "Gate Summary"
        if: always()
        run: |
          echo "## Release Gate Results for v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Automated (L1-L3)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] L1+L2 Unit & Integration" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] TypeScript check" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Build check" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] L3 Live Agent tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 发布前本地验证 (L3)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Playwright Electron E2E：需要本机 Provider 配置，按发布前流程单独执行" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] PDF 422 回归：当前产品层只传递 PDF 不可直接读取的说明文本" >> $GITHUB_STEP_SUMMARY
